<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Laboratory | Growth & Recursion</title>
    <meta name="description" content="Growth curves against Big-O, recursion trees, and Fibonacci: naive vs memoized vs iterative.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/primitives.css">
    <link rel="stylesheet" href="css/lab.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

    <div class="lab-container">
        <div class="header-with-nav" style="display: flex; justify-content: center; align-items: center; gap: 15px; flex-direction: column;">
            <h1>Algorithm Laboratory: Growth & Recursion</h1>
            <div id="algo-nav" data-algo-nav data-current-id="growth"></div>
        </div>

        <main class="lab-layout" id="growth-app">
            <aside class="side-panel">
                <div class="mode-tabs" role="tablist" aria-label="Growth mode" style="display:flex;flex-direction:column;gap:8px;">
                    <div style="display:flex;gap:8px;">
                        <button class="mode-tab active-tab" id="growth-curves" role="tab" aria-selected="true" style="flex:1;">Growth curves</button>
                        <button class="mode-tab" id="growth-tree" role="tab" aria-selected="false" style="flex:1;">Recursion tree</button>
                    </div>
                    <div style="display:flex;justify-content:center;">
                        <button class="mode-tab" id="growth-learn" role="tab" aria-selected="false" style="flex:0 0 auto;min-width:120px;">Learn</button>
                    </div>
                </div>
                <section id="curve-controls">
                    <div class="control-group"><label>Algorithms</label><label><input type="checkbox" value="bubble" checked> Bubble</label><label><input type="checkbox" value="merge" checked> Merge</label><label><input type="checkbox" value="quick" checked> Quick</label><label><input type="checkbox" value="insertion"> Insertion</label></div>
                    <div class="control-group"><label for="growth-sizes">Sizes</label><select id="growth-sizes"><option value="50,100,200,400,800">Small (to 800)</option><option value="1000,2500,5000,10000,20000">Large (to 20,000)</option></select></div>
                    <div class="control-group"><label for="growth-input">Input kind</label><select id="growth-input"><option value="random">Random</option><option value="sorted">Sorted</option><option value="reversed">Reversed</option></select></div>
                    <div class="control-group"><label for="growth-repeats">Repeats</label><select id="growth-repeats"><option value="3">3</option><option value="5" selected>5</option><option value="7">7</option></select></div>
                    <button id="growth-run">Run benchmark</button>
                </section>
                <section id="tree-controls" class="hidden">
                    <div class="control-group"><label for="recursion-algorithm">Algorithm</label><select id="recursion-algorithm"><option value="merge_sort">Merge sort</option><option value="quick_sort">Quicksort</option><option value="fib_naive">Fibonacci naive</option><option value="fib_memo">Fibonacci memoized</option></select></div>
                    <div class="control-group"><label for="recursion-array">Array (2–16 integers)</label><input id="recursion-array" value="8,3,6,1,7,2,5,4"></div>
                    <div class="control-group"><label for="recursion-n">Fibonacci n (0–10)</label><input id="recursion-n" type="number" min="0" max="10" value="5"></div>
                    <button id="recursion-run">Build recursion tree</button>
                </section>
                <section id="learn-controls" class="hidden"><h2 class="panel-heading">Four lessons</h2><select id="growth-lesson-select"></select><div id="growth-lesson-copy" class="panel-note"></div><button id="growth-quiz">Take the quiz</button></section>
                <div class="step-row"><button id="growth-prev">Prev</button><button id="growth-play">Play</button><button id="growth-next">Next</button><button id="growth-skip">Skip to end</button></div>
                <p id="growth-step" class="step-counter" aria-live="polite">No trace loaded.</p>
            </aside>
            <section class="visualizer-panel">
                <div id="growth-error" class="error-banner hidden" role="alert"></div>
                <div class="panel-card" id="growth-chart-panel"><div class="step-row"><label><input type="radio" name="metric" value="comparisons" checked> Comparisons (exact)</label><label><input type="radio" name="metric" value="time"> Time ms</label><label><input id="growth-log" type="checkbox"> Log–log</label></div><p class="panel-note">Wall-clock time is a measurement, not a proof; comparison counts are exact.</p><div id="growth-chart" class="growth-chart-container"></div></div>
                <div class="panel-card hidden" id="growth-tree-panel"><div id="growth-tree-canvas" class="tree-canvas-container"></div><div class="step-row"><button id="tree-collapse">Collapse current node</button><button id="tree-expand">Expand all</button></div></div>
                <div class="panel-card"><p id="growth-annotation" aria-live="polite">Choose a mode and run a trace.</p><div class="metrics-grid"><div class="metric-box"><span class="metric-label">Calls</span><span id="growth-calls" class="metric-value">—</span></div><div class="metric-box"><span class="metric-label">Depth</span><span id="growth-depth" class="metric-value">—</span></div><div class="metric-box"><span class="metric-label">Cache hits</span><span id="growth-hits" class="metric-value">—</span></div></div></div>
                <div id="growth-quiz-host"></div>
            </section>
        </main>
    </div>

    <script src="js/shell/units.js"></script>
    <script src="js/shell/nav.js"></script>
    <script type="module" src="js/growth.js"></script>
</body>
</html>
